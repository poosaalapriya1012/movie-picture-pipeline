name: Frontend Continuous Integration

on:
  pull_request:
    branches: ["main"]
    paths:
      - 'starter/frontend/**'
  workflow_dispatch:

jobs:
  lint:
    name: LINT JOB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./starter/frontend
        run: npm ci

      - name: Run the npm run lint command
        working-directory: ./starter/frontend
        run: npm run lint

  test:
    name: TEST JOB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./starter/frontend
        run: npm ci

      - name: Run the npm run test command
        working-directory: ./starter/frontend
        run: CI=true npm test

  build:
    name: BUILD JOB
    needs: [lint, test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./starter/frontend
        run: npm ci

      - name: Build the application using docker
        env:
          REACT_APP_MOVIE_API_URL: http://localhost:5000
        working-directory: ./starter/frontend
        run: |
          docker build \
            --build-arg=REACT_APP_MOVIE_API_URL=$REACT_APP_MOVIE_API_URL \
            --tag mp-frontend:latest .